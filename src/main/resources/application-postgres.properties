server.port=8080

# PostgreSQL profile for Phase 2 persistence.
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=${ROOMATEDASH_DB_URL:jdbc:postgresql://localhost:5432/roomatedash}
spring.datasource.username=${ROOMATEDASH_DB_USERNAME:postgres}
spring.datasource.password=${ROOMATEDASH_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
